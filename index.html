<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA — Official Site</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="space"></canvas>
  <nav class="nav">
    <a href="#top" class="nav-logo">NOVA</a>
    <div class="nav-links">
      <a href="#single">New single</a>
      <a href="#listen">Listen</a>
      <a href="#connect">Connect</a>
    </div>
  </nav>

  <header class="hero" id="top">
        <a href="#single" class="scroll-cue">
      <span>scroll</span>
      <span class="scroll-line"></span>
    </a>
    <p class="hero-kicker">✦ NOVA incoming ✦</p>
    <h1 class="hero-title" id="novaTitle">NOVA</h1>
    <p class="hero-sub">pop from another galaxy</p>
  </header>
    <section class="single reveal" id="single">
    <div class="single-text">
      <p class="label">The new single</p>
      <h2 class="single-title">DARE U.</h2>
      <p class="label out-now"><span class="dot"></span> Out now</p>

      <div class="single-actions">
        <a class="btn btn-solid" href="https://music.apple.com/us/song/dare-u-directors-cut/6829102272" target="_blank">Listen now →</a>
        <a class="btn btn-ghost" href="https://youtu.be/4--QJRavSuA" target="_blank">Watch the video →</a>
      </div>
    </div>

    <div class="video-frame">
      <iframe src="https://www.youtube-nocookie.com/embed/4--QJRavSuA"
        title="NOVA — DARE U. (Official Video)"
        allowfullscreen></iframe>
    </div>
  </section>

  <section class="links reveal" id="listen">
    <p class="label">Listen</p>
    <a class="link-row" href="PASTE-SPOTIFY-LINK" target="_blank">
      <span class="link-name">Spotify</span><span class="link-arrow">→</span>
    </a>
    <a class="link-row" href="https://music.apple.com/us/song/dare-u-directors-cut/6829102272" target="_blank">
      <span class="link-name">Apple Music</span><span class="link-arrow">→</span>
    </a>
    <a class="link-row" href="https://youtu.be/4--QJRavSuA" target="_blank">
      <span class="link-name">YouTube</span><span class="link-arrow">→</span>
    </a>
  </section>

  <section class="links reveal" id="connect">
    <p class="label">Connect</p>
    <a class="link-row" href="PASTE-INSTAGRAM-LINK" target="_blank">
      <span class="link-name">Instagram</span><span class="link-arrow">→</span>
    </a>
    <a class="link-row" href="PASTE-TIKTOK-LINK" target="_blank">
      <span class="link-name">TikTok</span><span class="link-arrow">→</span>
    </a>
    <a class="link-row" href="https://linktr.ee/thisisnovaworld" target="_blank">
      <span class="link-name">All links</span><span class="link-arrow">→</span>
    </a>
  </section>

  <footer class="footer">
    <p>© <span id="year"></span> NOVA · all rights reserved</p>
    <p class="footer-hint">psst — click the big NOVA ✦</p>
  </footer>

  <script src="script.js"></script>
